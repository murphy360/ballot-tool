name: Probe results source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe-sos.mjs", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-sos.mjs
